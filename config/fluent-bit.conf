[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/suricata/eve.json
    Parser            json
    Tag               suricata
    DB                /var/flb_suricata.db
    Mem_Buf_Limit     5MB

[FILTER]
    Name    record_modifier
    Match   suricata
    Record  short_message suricata_event

# Les objets imbriques de Suricata (alert.*, http.*, flow.*, dns.*, ...) ne
# sont pas flattenes automatiquement par le plugin de sortie GELF : sans ce
# filtre, tout finit serialise dans un seul champ "log" illisible et non
# filtrable cote OpenSearch/Graylog.
[FILTER]
    Name    nest
    Match   suricata
    Operation lift
    Nested_under alert
    Add_prefix alert_

[FILTER]
    Name    nest
    Match   suricata
    Operation lift
    Nested_under http
    Add_prefix http_

[FILTER]
    Name    nest
    Match   suricata
    Operation lift
    Nested_under dns
    Add_prefix dns_

[FILTER]
    Name    nest
    Match   suricata
    Operation lift
    Nested_under flow
    Add_prefix flow_

[OUTPUT]
    Name                  gelf
    Match                 *
    Host                  graylog
    Port                  12201
    Mode                  udp
    Gelf_Short_Message_Key short_message
