services:
  # ==========================================
  # --- PARTIE SOC (SÉCURITÉ ET LOGS) ---
  # ==========================================

  mongodb:
    image: mongo:latest
    container_name: chausec-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: superAdmin
      MONGO_INITDB_ROOT_PASSWORD: Chaussec.123
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chaussec_net

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: chaussec-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=chaussec-cluster
      - node.name=chaussec-node1
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - chaussec_net

  graylog:
    image: graylog/graylog:7.1
    container_name: chaussec-graylog
    restart: unless-stopped
    environment:
      - GRAYLOG_PASSWORD_SECRET=UnSecretVraimentTresLongPourChaussec2026!
      - GRAYLOG_ROOT_PASSWORD_SHA2=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      - GRAYLOG_HTTP_EXTERNAL_URI=http://127.0.0.1:9000/
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://superAdmin:Chaussec.123@mongodb:27017/graylog?authSource=admin
    ports:
      - "9000:9000"
      - "1514:1514/udp"
      - "5044:5044/tcp"
      - "12201:12201/udp"
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/api/system/lbstatus | grep -q ALIVE"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - chaussec_net

  # ==========================================
  # --- PARTIE SONDE ET COLLECTE ---
  # ==========================================

  suricata:
    image: jasonish/suricata:6.0.10
    container_name: chaussec-suricata
    restart: unless-stopped
    network_mode: host
    command: -i eth0
    volumes:
      - suricata_logs:/var/log/suricata

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: chaussec-fluent-bit
    restart: unless-stopped
    volumes:
      - ./config/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - suricata_logs:/var/log/suricata:ro
    depends_on:
      graylog:
        condition: service_healthy
    networks:
      - chaussec_net

  requincable:
    image: scxrrow/chaussecrequin:latest
    container_name: chaussec-requincable
    restart: unless-stopped
    ports:
      - "5010:5010"
    networks:
      - chaussec_net

  # ==========================================
  # --- PARTIE MÉTRIQUES (INFLUXDB) ---
  # ==========================================

  influxdb:
    image: influxdb:2.7
    container_name: chaussec-influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=chaussec2026!
      - DOCKER_INFLUXDB_INIT_ORG=chaussec
      - DOCKER_INFLUXDB_INIT_BUCKET=chaussec_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=chaussec-super-secret-token-2026
      - DOCKER_INFLUXDB_INIT_RETENTION=10h
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - chaussec_net

  # ==========================================
  # --- PARTIE SUPERVISION ET DASHBOARDS ---
  # ==========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: chaussec-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - chaussec_net

  grafana:
    image: grafana/grafana:latest
    container_name: chaussec-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Permet l'embedding des panels dans des iframes
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Accès anonyme pour les panels embarqués dans le frontend
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
      - influxdb
    volumes:
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/chaussec-dashboard.json:/etc/grafana/provisioning/dashboards/chaussec-dashboard.json:ro
    networks:
      - chaussec_net

  chaussec-api:
    image: scxrrow/chaussecapi:latest
    container_name: chaussec-api
    restart: unless-stopped
    environment:
      - SERVER_PORT=5050
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=chaussec-super-secret-token-2026
      - INFLUXDB_ORG=chaussec
      - INFLUXDB_BUCKET=chaussec_metrics
      - OPENSEARCH_URL=http://opensearch:9200
      - MANAGEMENT_INFLUX_METRICS_EXPORT_URI=http://influxdb:8086
      - MANAGEMENT_INFLUX_METRICS_EXPORT_API_VERSION=v2
      - MANAGEMENT_INFLUX_METRICS_EXPORT_ORG=chaussec
      - MANAGEMENT_INFLUX_METRICS_EXPORT_BUCKET=chaussec_metrics
      - MANAGEMENT_INFLUX_METRICS_EXPORT_TOKEN=chaussec-super-secret-token-2026
      - MANAGEMENT_INFLUX_METRICS_EXPORT_AUTO_CREATE_DB=false
    ports:
      - "5050:5050"
    depends_on:
      - influxdb
      - opensearch
    networks:
      - chaussec_net

  # LDAP sidecar — partage le réseau de chaussec-api pour que
  # localhost:389 soit accessible depuis l'API (hardcodé dans SecurityConfig)
  chaussec-ldap:
    image: osixia/openldap:latest
    container_name: chaussec-ldap
    restart: unless-stopped
    environment:
      - LDAP_ORGANISATION=ChausSec
      - LDAP_DOMAIN=chaussec.org
      - LDAP_ADMIN_PASSWORD=adminpassword
      - LDAP_BASE_DN=dc=chaussec,dc=org
      - LDAP_TLS=false
    command: --copy-service
    volumes:
      - ./config/ldap-init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/init.ldif:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    network_mode: "container:chaussec-api"
    depends_on:
      - chaussec-api

  # ==========================================
  # --- FRONTEND SOC ---
  # ==========================================

  chaussec-frontend:
    image: scxrrow/chaussecui:latest
    container_name: chaussec-frontend
    restart: unless-stopped
    ports:
      - "4173:80"
    environment: 
      - VITE_GRAFANA_URL=http://localhost:3000
      - VITE_GRAFANA_DASHBOARD_UID=chaussec-soc
    depends_on:
      - chaussec-api
    networks:
      - chaussec_net

# ==========================================
# --- VOLUMES ET RÉSEAUX ---
# ==========================================

volumes:
  mongodb_data:
  opensearch_data:
  suricata_logs:
  influxdb_data:
  ldap_data:
  ldap_config:

networks:
  chaussec_net:
    driver: bridge
